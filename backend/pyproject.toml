[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-automation-backend"
version = "0.1.0"
description = "Invoice automation backend with OCR processing"
authors = [{name = "Invoice Automation Team"}]
license = {text = "MIT"}
dependencies = [
    "fastapi[all]>=0.104.1",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.5.0",
    "opencv-python>=4.8.1.78",
    "pytesseract>=0.3.10",
    "alembic>=1.13.1",
    "python-multipart>=0.0.6",
    "pillow>=10.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.3",
    "httpx>=0.25.2",
    "pytest-asyncio>=0.21.1",
]
dev = [
    "ruff>=0.1.6",
    "black>=23.11.0",
    "mypy>=1.7.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true